<div class="app">
  <header class="app__header">
    <h1 class="app__title">{{ title }}</h1>
    <p class="app__subtitle">Calcula las probabilidades de encontrar cartas específicas en tu mazo</p>
  </header>

  <main class="app__main">
    <div class="app__layout">
      <section class="app__section app__section--deck-config">
        <app-deck-configuration></app-deck-configuration>
      </section>

      <section class="app__section app__section--calculator">
        <app-search-selector 
          (searchConfigured)="calculateProbability($event)"
        ></app-search-selector>
        <app-probability-results 
          [result]="probabilityResult"
        ></app-probability-results>
      </section>

      <section class="app__section app__section--tracker">
        <app-card-tracker></app-card-tracker>
      </section>
    </div>
  </main>

  <footer class="app__footer">
    <p>Digimon TCG Probability Calculator © 2026</p>
  </footer>
</div>

<header class="calculator-header">
  <div class="calculator-header__content">
    <div class="calculator-header__text">
      <h1 class="calculator-header__title">{{ title }}</h1>
      <p class="calculator-header__description">{{ description }}</p>
    </div>
    <button 
      class="calculator-header__theme-toggle"
      (click)="toggleTheme()"
      [attr.aria-label]="(isDarkMode$ | async) ? 'Cambiar a modo claro' : 'Cambiar a modo oscuro'"
      type="button"
    >
      <lucide-icon
        *ngIf="!(isDarkMode$ | async)"
        class="theme-toggle__icon theme-toggle__icon--sun"
        [img]="sunIcon"
        [size]="24"
        [strokeWidth]="2"
        aria-hidden="true"
      ></lucide-icon>
      <lucide-icon
        *ngIf="isDarkMode$ | async"
        class="theme-toggle__icon theme-toggle__icon--moon"
        [img]="moonIcon"
        [size]="24"
        [strokeWidth]="2"
        aria-hidden="true"
      ></lucide-icon>
    </button>
  </div>
</header>

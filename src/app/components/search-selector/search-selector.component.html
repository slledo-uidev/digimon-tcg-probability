<div class="search-selector">
  <h2 class="search-selector__title">Configurar Búsqueda</h2>

  <form [formGroup]="searchForm" (ngSubmit)="onSubmit()" class="search-selector__form">
    <div class="search-selector__method">
      <label class="search-selector__label">Método de Búsqueda</label>
      <div class="search-selector__method-options">
        <label class="search-selector__radio">
          <input 
            type="radio" 
            formControlName="method" 
            [value]="searchMethodType.TRAINING"
          />
          <span>Training (2 cartas por color)</span>
        </label>
        <label class="search-selector__radio">
          <input 
            type="radio" 
            formControlName="method" 
            [value]="searchMethodType.MEMORY"
          />
          <span>Memory (3-4 cartas por tipo)</span>
        </label>
        <label class="search-selector__radio">
          <input 
            type="radio" 
            formControlName="method" 
            [value]="searchMethodType.SPECIFIC_SEARCH"
          />
          <span>Buscador Específico</span>
        </label>
        <label class="search-selector__radio">
          <input 
            type="radio" 
            formControlName="method" 
            [value]="searchMethodType.PLAIN_DRAW"
          />
          <span>Robo Plano</span>
        </label>
      </div>
    </div>

    <!-- Training Parameters -->
    <div class="search-selector__params" *ngIf="currentMethod === searchMethodType.TRAINING">
      <div class="search-selector__form-group">
        <label class="search-selector__label" for="training-color">Color</label>
        <select 
          class="search-selector__select" 
          id="training-color" 
          formControlName="filterValue"
        >
          <option value="">Selecciona un color</option>
          <option *ngFor="let color of availableColors" [value]="color">{{ color }}</option>
        </select>
      </div>
      <p class="search-selector__info">Busca 2 cartas del color seleccionado</p>
    </div>

    <!-- Memory Parameters -->
    <div class="search-selector__params" *ngIf="currentMethod === searchMethodType.MEMORY">
      <div class="search-selector__form-group">
        <label class="search-selector__label" for="memory-category">Categoría</label>
        <select 
          class="search-selector__select" 
          id="memory-category" 
          formControlName="filterCategory"
        >
          <option value="color">Color</option>
          <option value="type">Tipo</option>
        </select>
      </div>
      <div class="search-selector__form-group">
        <label class="search-selector__label" for="memory-value">Valor</label>
        <select 
          class="search-selector__select" 
          id="memory-value" 
          formControlName="filterValue"
        >
          <option value="">Selecciona un valor</option>
          <ng-container *ngIf="searchForm.get('filterCategory')?.value === 'color'">
            <option *ngFor="let color of availableColors" [value]="color">{{ color }}</option>
          </ng-container>
          <ng-container *ngIf="searchForm.get('filterCategory')?.value === 'type'">
            <option *ngFor="let type of availableTypes" [value]="type">{{ type }}</option>
          </ng-container>
        </select>
      </div>
      <div class="search-selector__form-group">
        <label class="search-selector__label" for="memory-size">Cantidad a buscar</label>
        <input 
          class="search-selector__input" 
          id="memory-size" 
          type="number" 
          formControlName="searchSize" 
          min="1" 
          max="10"
        />
      </div>
    </div>

    <!-- Specific Search & Plain Draw Parameters -->
    <div 
      class="search-selector__params" 
      *ngIf="currentMethod === searchMethodType.SPECIFIC_SEARCH || currentMethod === searchMethodType.PLAIN_DRAW"
    >
      <div class="search-selector__form-group">
        <label class="search-selector__label">Cartas Objetivo</label>
        <div class="search-selector__card-selection">
          <div 
            class="search-selector__card-option" 
            *ngFor="let card of availableCards"
            [class.search-selector__card-option--selected]="isCardSelected(card.id)"
            (click)="toggleCardSelection(card.id)"
          >
            <span class="search-selector__card-name">{{ card.name }}</span>
            <span class="search-selector__card-remaining">({{ card.remaining }})</span>
          </div>
          <p class="search-selector__empty" *ngIf="availableCards.length === 0">
            No hay cartas disponibles
          </p>
        </div>
        <p class="search-selector__selected-count">
          {{ selectedCards.length }} carta(s) seleccionada(s)
        </p>
      </div>
      <div class="search-selector__form-group">
        <label class="search-selector__label" for="draw-size">Cantidad a robar/buscar</label>
        <input 
          class="search-selector__input" 
          id="draw-size" 
          type="number" 
          formControlName="drawSize" 
          min="1" 
          max="20"
        />
      </div>
    </div>

    <button 
      class="search-selector__button" 
      type="submit"
      [disabled]="!isFormValid()"
    >
      Calcular Probabilidad
    </button>
  </form>

  <div class="search-selector__warning" *ngIf="!deckState || deckState.cards.length === 0">
    ⚠️ Configura tu mazo primero
  </div>

  <div class="search-selector__warning" *ngIf="deckState && deckState.cardsRemaining === 0">
    ⚠️ No quedan cartas en el mazo
  </div>
</div>
